<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Signing you in…</title>
  <style>
    body { font-family: Arial, sans-serif; background: #070b0f; color: #e6edf3; display: grid; place-items: center; height: 100vh; margin: 0; }
    .card { background: #0d1117; border: 1px solid #21262d; border-radius: 12px; padding: 24px; max-width: 360px; text-align: center; }
    .spinner { width: 36px; height: 36px; border: 3px solid #21262d; border-top-color: #f85149; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 12px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner"></div>
    <h2>Finishing sign-in</h2>
    <p>You’ll be redirected back to the app shortly.</p>
  </div>
  <script>
    (function () {
      const params = new URLSearchParams(window.location.hash.substring(1));
      const accessToken = params.get('access_token');
      const refreshToken = params.get('refresh_token');
      const error = params.get('error');
      const errorDescription = params.get('error_description');
      if (error) {
        localStorage.setItem('safroute_auth_error', errorDescription || error);
        window.location.replace('/');
        return;
      }
      if (accessToken) {
        localStorage.setItem('supabase_access_token', accessToken);
        if (refreshToken) localStorage.setItem('supabase_refresh_token', refreshToken);
        window.location.replace('/');
        return;
      }
      window.location.replace('/');
    })();
  </script>
</body>
</html>
